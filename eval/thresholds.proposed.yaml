selection:
- optimal set = feasible grid points with the best objective
- 'pick the point deepest inside the optimal set: largest (min, sum) of grid steps to the nearest non-optimal point along
  each axis (the grid edge counts as non-optimal)'
- then closest to the current values, then the lower values
